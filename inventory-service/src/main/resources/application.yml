# inventory-service configuration
#
# Most of the actual consumer wiring lives in code
# (config/KafkaConsumerConfig.java) rather than here, specifically so the
# AckMode decision has a comment sitting right next to it. This file just
# supplies the raw values that code reads.

server:
  # Build Order Step 8's first REST endpoints (internal command interface
  # for order-saga-orchestrator) mean this service now needs a port —
  # order-service=8080, fraud-detection-service=8082,
  # analytics-service=8084, schema-registry=8085 (docker), this=8086.
  #
  # Real, worth noting cost: Build Order Step 2's "run this same jar
  # again in another terminal, zero config, zero port conflicts" story
  # (see InventoryServiceApplication's Javadoc) is GONE for the REST side
  # of this service now — two instances would collide on 8086. The Kafka
  # consumer side still scales exactly as it always did (that's a
  # completely separate mechanism); only the NEW synchronous entry point
  # picked up this constraint, and only because a synchronous entry point
  # always needs SOME single address to be reached at.
  port: 8086

spring:
  application:
    name: inventory-service

  # Build Order Step 9: stock's source of truth moves from an in-memory
  # map to Postgres, sharing order-service's DATABASE (not its tables —
  # see schema.sql) the same way order-saga-orchestrator already does.
  datasource:
    url: jdbc:postgresql://localhost:5432/orderflow
    username: orderflow
    password: orderflow
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      # Every instance of inventory-service you start with THIS group-id
      # shares the order-created topic's partitions between them — that's
      # the mechanism Build Order Step 2 uses to demonstrate horizontal
      # scaling and rebalancing. Change this string and you've created an
      # entirely independent consumer, re-reading the whole topic from
      # scratch.
      group-id: inventory-service-group

      properties:
        # Same registry order-service's producer talks to. Both sides
        # agreeing on this URL is what lets the consumer fetch the exact
        # writer schema a given message was produced with, by the schema
        # ID embedded in the message — see KafkaConsumerConfig.java.
        schema.registry.url: http://localhost:8085

      # A GOTCHA WORTH KEEPING VISIBLE: you might expect to write
      #   client-id: inventory-instance-${random.uuid}
      # here and read it via @Value in both KafkaConsumerConfig and
      # InventoryServiceApplication. We tried exactly that — it compiles,
      # it runs, and it's WRONG: ${random.uuid} is a placeholder that gets
      # re-evaluated independently by every single @Value("${...}") call
      # site that references this key, so two different classes each got
      # their own, different, random UUID for what was supposed to be one
      # instance's single identity. Caught it only by actually running two
      # instances and comparing their logs — the startup banner and the
      # rebalance listener showed two different ids for the same JVM.
      # Fixed by generating the id ONCE in code (see
      # KafkaConsumerConfig.clientId) and sharing it via a Spring bean
      # instead of a property placeholder. No client-id key here anymore
      # on purpose — the source of truth moved to Java.

    # Build Order Step 4: this service was pure-consumer through Step 3 —
    # no producer config existed anywhere in this file. Retry topics
    # change that. When @RetryableTopic's error handling decides a
    # message needs to move to the next retry topic (or the DLT), it does
    # that by PUBLISHING the record there — which means this consumer-only
    # service now needs a working producer too. We don't define a custom
    # KafkaTemplate bean for it (contrast with the hand-built
    # ConsumerFactory in KafkaConsumerConfig.java) — Spring Boot's
    # autoconfiguration builds a default one straight from these
    # properties, the same way order-service's producer side always has,
    # and that's the exact bean Spring Kafka's retry-topic machinery
    # looks up and uses automatically.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        schema.registry.url: http://localhost:8085

# Build Order Step 9 tuning knobs — externalized (rather than hardcoded
# constants) so the live tests documented in the root README can override
# them, same pattern as order-service's outbox.relay.poll-interval-ms.
inventory:
  cache:
    # How long a cached stock count is trusted before cache-aside falls
    # back to Postgres again, even without an explicit invalidation. A
    # safety net for the case where something writes to stock WITHOUT
    # going through StockService (a manual SQL UPDATE, a future admin
    # tool) and therefore never explicitly invalidates the cache — short
    # TTL bounds how stale a read can get in that scenario.
    ttl-seconds: 30
  lock:
    # How long a distributed lock is held before it expires on its own.
    # Must safely outlast the reserve-and-write it protects (a slow
    # Postgres write shouldn't outlive its own lock) but short enough
    # that a crashed lock-holder doesn't wedge a product for long. A real
    # deployment would also watch for "held longer than expected" as an
    # operational alert, not just rely on the TTL silently expiring.
    ttl-ms: 5000
  dedupe:
    # How long an orderId is remembered as "already processed" for
    # idempotent-consumer dedupe. Long enough to outlast any realistic
    # redelivery window (a retry-topic hop, Build Order Step 4, plus
    # normal consumer-group rebalance delay); not forever, so Redis
    # doesn't accumulate one key per order ever placed.
    ttl-hours: 24

# Build Order Step 11 — see order-service/application.yml's comment.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.orderflow: INFO
