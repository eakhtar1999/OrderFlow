# Tells Grafana to load every dashboard JSON file from
# /var/lib/grafana/dashboards (mounted from ../dashboards) automatically
# on startup — the dashboard itself is committed to this repo as plain
# JSON, not built by hand through Grafana's UI and left un-reproducible.
apiVersion: 1

providers:
  - name: OrderFlow
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
