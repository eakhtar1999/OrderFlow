# ════════════════════════════════════════════════════════════════════════
# OrderFlow infrastructure.
#
# This file grew alongside the Build Order in the root README, one infra
# block uncommented per step, exactly when the code that needed it
# existed — never the whole target architecture (section 8 of claude.md)
# on day one, since uncommenting infra you don't have code for yet just
# wastes laptop RAM. As of Build Order Step 12, this history is complete:
# every block below is active and genuinely used by at least one service.
# `git log -p docker-compose.yml` (or just the root README's own
# Step-by-step walkthroughs) shows the actual order each piece was
# uncommented in, if you want to see it grow the way it originally did.
#
# Run: docker compose up -d
# Stop: docker compose down            (add -v to also wipe topic data)
# ════════════════════════════════════════════════════════════════════════

services:

  # ── Kafka, KRaft mode (no Zookeeper) ─────────────────────────────────
  # KRaft is Kafka's own Raft-based metadata quorum, replacing Zookeeper
  # as of Kafka 3.x+. Running "combined" mode (one process is both broker
  # and controller) is a single-node simplification — real clusters
  # dedicate separate controller nodes for a proper Raft quorum. Good
  # enough for a tutorial; see the root README's "KRaft mode" section for
  # what changes in a real deployment.
  kafka:
    image: apache/kafka:3.8.0
    container_name: orderflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      # Single-node dev cluster: replication factor 1 everywhere. A real
      # cluster sets these to 3 so losing one broker doesn't lose data —
      # see KafkaTopicConfig.java's comment on the same trade-off applied
      # to our one application-level topic.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Found live, Build Order Step 12: without this, apache/kafka:3.8.0
      # actually writes its log segments to /tmp/kafka-logs, NOT
      # /var/lib/kafka/data — meaning the `kafka-data` volume below was
      # mounted at the WRONG path for this image's real default, and
      # every topic + every consumer-group offset had been silently
      # non-persistent (surviving only as long as one container instance
      # stayed up) for this entire project, undetected until a true
      # cold-start test (`docker compose down` with no `-v`, then `up -d`
      # again) came back with zero application topics — confirmed via
      # `docker exec orderflow-kafka find / -iname kafka-logs`, which
      # located the real, actively-written directory. KAFKA_LOG_DIRS
      # explicitly points log.dirs at the SAME path the volume below is
      # mounted to, closing the gap.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ── Kafka UI ─────────────────────────────────────────────────────────
  # Browse topics/partitions/consumer-groups/lag without the CLI. Point
  # your browser at http://localhost:8081 once this is up. This is where
  # you'll SEE the rebalancing, partition assignment, and consumer lag
  # concepts the code comments describe, instead of just reading about
  # them.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: orderflow-kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: orderflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  # ════════════════════════════════════════════════════════════════════
  # Build Order Step 12: this file now genuinely runs the FULL target
  # infrastructure — every service below is active, not a future
  # placeholder. Only kafka-connect (Debezium, the outbox-relay
  # ALTERNATIVE this project deliberately didn't build — see the root
  # README's comparison table) stays commented out, on purpose, as a
  # worked example of "here's exactly what you'd add if you wanted to
  # try the other approach."
  # ════════════════════════════════════════════════════════════════════

  # ── Schema Registry (Build Order Step 3: Avro + Schema Registry) ────
  # Confluent's Schema Registry: a small HTTP service backed by its own
  # Kafka topic (_schemas) that stores every version of every schema ever
  # registered, keyed by "subject" (by default: "<topic>-value"). Its job
  # isn't just storage — every time a producer tries to register a NEW
  # version of a schema, the registry runs a COMPATIBILITY CHECK against
  # the previous version(s) and REJECTS the write if it would break an
  # existing consumer. That check is the entire value proposition over
  # "just hand-copy the DTO and hope" from Build Order Steps 1-2.
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.0
    container_name: orderflow-schema-registry
    ports:
      - "8085:8085"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8085
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      # BACKWARD (the default) means: a NEW schema version must be
      # readable by consumers still running the PREVIOUS version — safe
      # to upgrade consumers before producers. Explicit here because
      # which compatibility mode you pick changes what changes are even
      # allowed; see the root README's schema evolution walkthrough for
      # what this rejects vs. allows in practice.
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/subjects || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ── Postgres (Build Order Step 5: outbox pattern; Step 9: real stock) ─
  # order-service's source of truth. The whole point of Step 5 is that
  # order-service now writes HERE first — inside one ordinary ACID
  # transaction alongside the outbox row — and Kafka only finds out
  # afterward, via OutboxRelay. See order-service/README.md for why that
  # ordering is the entire fix for the dual-write problem.
  postgres:
    image: postgres:16
    container_name: orderflow-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
      POSTGRES_DB: orderflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Kafka Connect + Debezium (Build Order Step 5's ALTERNATIVE to the
  # ── polling OutboxRelay we actually built — see the root README's
  # ── "Debezium comparison" section before uncommenting this).
  # kafka-connect:
  #   image: debezium/connect:2.7
  #   container_name: orderflow-kafka-connect
  #   ports:
  #     - "8083:8083"

  # ── Redis (Build Order Step 9) ───────────────────────────────────────
  # Four completely different use cases share this ONE Redis instance:
  # cache-aside for inventory-service's stock (Postgres is the source of
  # truth, Redis is the read-through cache), a distributed lock preventing
  # overselling across concurrent inventory-service instances, an
  # idempotent-consumer dedupe store, and a token-bucket rate limiter for
  # order-service's REST API. Sharing one instance is a real, deliberate
  # simplification — a production deployment would likely give at least
  # the rate limiter and the dedupe store their own logical databases (or
  # separate Redis instances entirely) so a noisy neighbor on one use case
  # can't evict keys another use case needs.
  redis:
    image: redis:7
    container_name: orderflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Elasticsearch + Kibana (Build Order Step 10) ─────────────────────
  # search-indexer-service's target: a denormalized order document per
  # orderId, built from events across order/inventory/payment/shipment,
  # plus a second index fed from analytics-service's windowed aggregates
  # for Kibana to visualize. Security disabled and single-node mode are
  # both deliberate dev-only simplifications — a real deployment runs a
  # multi-node cluster with TLS and auth turned on, neither of which this
  # tutorial's single-laptop docker-compose needs to demonstrate the
  # actual indexing/search concepts.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: orderflow-elasticsearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      # Default ES heap (half of container RAM, no cap) is more than a
      # tutorial doing full-text search over a few hundred order
      # documents needs — capped low so this doesn't compete with 7
      # Spring Boot JVMs + Kafka + Postgres + Redis for laptop RAM.
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: orderflow-kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ── Prometheus + Grafana (Build Order Step 11) ───────────────────────
  # Every OrderFlow service runs on the HOST (mvn spring-boot:run), not
  # containerized — see observability/prometheus/prometheus.yml's comment
  # for why scrape targets use host.docker.internal instead of a compose
  # service name.
  prometheus:
    image: prom/prometheus:latest
    container_name: orderflow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      # Linux Docker doesn't resolve host.docker.internal by default the
      # way Docker Desktop (Mac/Windows) does — this makes the same
      # prometheus.yml work on both without an OS-specific config file.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: orderflow-grafana
    ports:
      - "3000:3000"
    environment:
      # Tutorial-only credential shortcut — a real deployment never ships
      # a default admin password, let alone documents it in a README.
      GF_SECURITY_ADMIN_PASSWORD: orderflow
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # ── Jaeger (Build Order Step 11) ──────────────────────────────────────
  # all-in-one bundles the collector, query service, and storage (in
  # memory — traces don't survive a restart, a deliberate tutorial
  # simplification; a real deployment backs this with Elasticsearch or
  # Cassandra) into one container. OTLP is Jaeger's default receiver
  # protocol as of 1.35+, matching what the OpenTelemetry Java agent
  # exports to out of the box — no translation layer needed between them.
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: orderflow-jaeger
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC receiver

volumes:
  kafka-data:
  postgres-data:
  elasticsearch-data:
