# order-service configuration
#
# Every Kafka behavior below is a deliberate choice, not a default left
# untouched — read the comment above each block before changing it.

server:
  port: 8080

spring:
  application:
    name: order-service

  # Build Order Step 5: order-service's source of truth moved to Postgres.
  # The HTTP request path (OrderController -> OutboxWriter) touches ONLY
  # this database — no Kafka call happens on the request thread anymore.
  # That's the entire fix for the dual-write problem: one system, one
  # ACID transaction, nothing to keep in sync across two different
  # failure domains during the request itself.
  datasource:
    url: jdbc:postgresql://localhost:5432/orderflow
    username: orderflow
    password: orderflow
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      # Run schema.sql on every startup. Safe to repeat because it's all
      # CREATE TABLE IF NOT EXISTS — a real project outgrows this almost
      # immediately and reaches for Flyway/Liquibase (versioned migrations,
      # not "the whole schema every time"), deliberately skipped here to
      # keep Step 5 focused on the outbox pattern itself, not schema
      # tooling.
      mode: always

  # Build Order Step 9: backs TokenBucketRateLimiter — the ONLY thing
  # order-service uses Redis for.
  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer

      # This is the ONE property that turns Spring Boot's auto-configured
      # KafkaTemplate into a TRANSACTIONAL producer — Boot detects it,
      # registers a KafkaTransactionManager, and gives the underlying
      # producer a transactional.id built from this prefix. OutboxRelay is
      # the only thing in this service that sends to Kafka now (the old
      # per-request OrderEventProducer is gone — see OutboxRelay's
      # Javadoc), and it needs this: publishing to order-created AND
      # order-status has to succeed or fail TOGETHER, not one-then-maybe-
      # the-other.
      #
      # 🔧 Forward-looking gotcha, not yet tested: if order-service ever
      # scales to multiple instances (like inventory-service did in Step
      # 2), each instance's producer needs a transactional.id that's
      # unique AND stable across restarts, or Kafka's fencing protocol
      # will kick one out. Spring Kafka appends a per-producer suffix to
      # this prefix automatically, which may or may not be enough on its
      # own — flagged here, not verified, because this project runs one
      # order-service instance through this step.
      transaction-id-prefix: order-service-outbox-

      properties:
        schema.registry.url: http://localhost:8085
        acks: all
        enable.idempotence: true

    # Build Order Step 8: order-service's first-ever consumer. Reacting
    # to the saga's own events (see OrderStatusUpdater.java) to keep
    # order-status genuinely useful — through Step 7 it only ever held
    # one value ("CREATED") per order, so log-compaction (Build Order
    # Step 5's whole justification for this topic) had nothing to
    # actually compact away yet. Now an order genuinely transitions
    # through multiple statuses, and compaction starts doing real work:
    # only the latest one survives per key.
    consumer:
      group-id: order-service-status-updater
      auto-offset-reset: earliest
      # Without this, Spring Boot defaults to StringDeserializer for the
      # value too, and the container fails converting every message
      # before OrderStatusUpdater's listener methods ever run — see
      # payment-service's application.yml for the full explanation (found
      # live, the hard way, testing this exact saga).
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        schema.registry.url: http://localhost:8085
        specific.avro.reader: true
      # Default (auto-commit) ack mode here too, same reasoning as
      # payment-service and shipment-service — manual ack was already
      # taught in depth on inventory-service's OrderEventListener; this
      # listener doesn't need to re-teach it to justify existing.

# How often OutboxRelay polls Postgres for unpublished rows. Externalized
# (rather than hardcoded in @Scheduled) so the crash-resilience exercise
# in the root README can override it to something much longer, giving you
# a comfortable window to kill -9 the process before the relay would have
# published on its own.
outbox:
  relay:
    poll-interval-ms: 500

# Build Order Step 9: TokenBucketRateLimiter's knobs. capacity=5 means a
# customer can burst up to 5 requests instantly; refill-per-second=1
# means the bucket regains one token per second after that — see
# TokenBucketRateLimiter's TRY IT YOURSELF for the exact test this is
# tuned to make easy to observe within a few seconds, not minutes.
order:
  rate-limit:
    capacity: 5
    refill-per-second: 1

# Build Order Step 11: exposes ONLY /actuator/health and
# /actuator/prometheus — actuator's default exposes far more
# (/actuator/env, /actuator/beans, /actuator/heapdump, ...) over plain
# HTTP with no auth, which is a real information-disclosure/DoS surface
# in anything beyond a laptop tutorial. Naming exactly what's exposed,
# rather than `include: "*"`, is the deliberate choice here.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      # Every service's metrics land in the SAME Prometheus instance —
      # this tag is what lets a Grafana query distinguish "order-service's
      # request latency" from "payment-service's," instead of one metric
      # name silently mixing data from all 8 services together.
      application: ${spring.application.name}

logging:
  level:
    com.orderflow: INFO
